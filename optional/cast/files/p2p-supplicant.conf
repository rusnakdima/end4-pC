# wpa_supplicant configuration template for end4-pC Cast (Wi-Fi Direct / P2P).
#
# The installer copies this to ~/.config/end4-pC/cast/p2p-supplicant.conf.
# It is NOT applied automatically.  After editing (set the correct country),
# a root step prints during install:
#
#   sudo install -Dm600 ~/.config/end4-pC/cast/p2p-supplicant.conf \
#        /etc/wpa_supplicant/p2p.conf
#   sudo wpa_supplicant -B -i <wifi-iface> -c /etc/wpa_supplicant/p2p.conf
#
# Replace <wifi-iface> with your P2P-capable device from `iw dev`.  The P2P
# interface (usually p2p-<wifi-iface>) is then used by waycast for Miracast.

ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=1

# Regulatory country: set this to your ISO-3166-1 alpha-2 code (KZ, US, DE...).
# A wrong/unset country can make 5 GHz P2P channels NO-IR and block the GO.
country=KZ

# Device identity shown on the TV during WPS / P2P discovery.
device_name=end4pc-cast
manufacturer=end4-pC
model_name=end4pc-cast
model_number=1
serial_number=end4pc-cast

# WPS: push-button is the most compatible with TVs; keep PIN available too.
config_methods=virtual_push_button physical_push_button virtual_display keypad

# Prefer being the P2P Group Owner so the TV connects to our soft-AP directly.
p2p_go_intent=15
p2p_go_ht40=1

# Do not let an idle P2P group linger after a session ends.
p2p_disconnect_freq=5
